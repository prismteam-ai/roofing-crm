# Local OpenSearch for Alakazam fixture replay only.
# Does not deploy a production index. Seed from corpus/*.jsonl after up.
services:
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: roofing-crm-rag-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - roofing-crm-rag-opensearch-data:/usr/share/opensearch/data

volumes:
  roofing-crm-rag-opensearch-data:
