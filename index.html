<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roofing leads · New Castle County</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-app="crm">
  <div class="apps">
    <button type="button" class="apps-button" aria-label="Switch app" aria-expanded="false" aria-controls="apps-menu">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="15" cy="3" r="1.5"/><circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="9" r="1.5"/><circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/><circle cx="15" cy="15" r="1.5"/></g></svg>
    </button>
    <nav id="apps-menu" class="apps-menu" hidden>
      <a href="https://newcastle-oracle-adamkalamchi-3665s-projects.vercel.app" data-app="oracle">New Castle Oracle<small>Property pipeline</small></a>
      <a href="https://roofing-crm-newcastle-adamkalamchi-3665s-projects.vercel.app" data-app="crm">Roofing leads<small>CRM</small></a>
    </nav>
  </div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="spark" aria-hidden="true"></span>Roofing leads</div>
      <button type="button" id="open-ask" class="search"><span class="spark" aria-hidden="true"></span><span>Ask about leads</span><kbd>⌘K</kbd></button>
      <nav class="views">
        <p class="side-label">Views</p>
        <button type="button" data-view="roofs" class="active">Roofs 15+ <span class="n" id="n-roofs"></span></button>
        <button type="button" data-view="permits">Open permits <span class="n" id="n-permits"></span></button>
        <button type="button" data-view="saved">Saved leads <span class="n" id="n-saved"></span></button>
        <p class="side-label">Coming later</p>
        <button type="button" disabled>Outreach</button>
        <button type="button" disabled>Scheduling</button>
        <button type="button" disabled>Invoices</button>
      </nav>
      <p id="status" class="status">Loading published property data…</p>
    </aside>

    <main class="main">
      <section class="ask">
        <h2><span class="gradient">Find roofs worth a call.</span></h2>
        <form id="ask-form" class="composer">
          <textarea id="question" rows="1" placeholder="Ask about roofs, permits, or contractors near a town">Which properties near Wilmington have open roofing permits that have been open for many years, and who is the listed contractor?</textarea>
          <button type="submit" class="send" aria-label="Ask">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 20.5v-17L22 12 3 20.5Zm2-3.1L16.9 12 5 6.6v4l6 1.4-6 1.4v4Z"/></svg>
          </button>
        </form>
        <div class="chips">
          <button type="button" class="chip" data-prompt="Which properties within 5 miles of Wilmington have roofs older than 15 years?">Old roofs near Wilmington</button>
          <button type="button" class="chip" data-prompt="Which open roof permits near Newark name a contractor?">Open permits near Newark</button>
          <button type="button" class="chip" data-prompt="Which roofs within 3 miles of Hockessin are 15 years or older?">Roofs around Hockessin</button>
        </div>
        <div id="answer"></div>
      </section>

      <header class="page-head">
        <div>
          <h1 id="view-title">Roofs 15+</h1>
          <p id="count" class="muted"></p>
        </div>
        <div class="segmented" role="group" aria-label="Row density">
          <button type="button" data-density="standard" class="active">Standard</button>
          <button type="button" data-density="compact">Compact</button>
        </div>
      </header>

      <form id="search-form" class="filters">
        <label class="filter"><span>Lat</span><input id="lat" type="number" step="0.000001" value="39.739072"></label>
        <label class="filter"><span>Lon</span><input id="lon" type="number" step="0.000001" value="-75.539787"></label>
        <label class="filter small"><span>Radius mi</span><input id="miles" type="number" min="0.1" max="30" step="0.1" value="5"></label>
        <label class="filter small" id="age-filter"><span>Roof age ≥</span><input id="min-age" type="number" min="0" value="15"></label>
        <button type="submit" class="btn primary">Apply</button>
        <button type="button" id="use-gps" class="btn tonal">Use my location</button>
        <button type="button" id="use-pin" class="btn text">Use map pin</button>
      </form>
      <p id="gps-status" class="muted"></p>
      <div id="map"></div>
      <div id="results" class="table-wrap"></div>
    </main>
  </div>

  <aside id="drawer" class="drawer" aria-label="Property details"></aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
