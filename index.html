<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roofing CRM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">New Castle County, Delaware</p>
      <h1>Roofing leads</h1>
    </div>
    <p id="status">Loading published property data.</p>
  </header>
  <div class="layout">
    <section>
      <form id="search-form">
        <label>Latitude <input id="lat" type="number" step="0.000001" value="39.739072"></label>
        <label>Longitude <input id="lon" type="number" step="0.000001" value="-75.539787"></label>
        <label>Radius <input id="miles" type="number" min="0.1" max="30" step="0.1" value="5"></label>
        <label>Min age <input id="min-age" type="number" value="15"></label>
        <button type="submit">Search</button>
        <button type="button" id="use-pin">Use map pin</button>
        <button type="button" id="use-gps">Use my location</button>
      </form>
      <p id="gps-status"></p>
      <div id="map"></div>
      <p id="count"></p>
      <div id="results"></div>
    </section>
    <aside>
      <h2>Saved leads</h2>
      <div id="saved"></div>
      <h2>Ask</h2>
      <form id="ask-form">
        <textarea id="question" rows="4">Which properties near Wilmington have open roofing permits that have been open for many years, and who is the listed contractor?</textarea>
        <button type="submit">Answer</button>
      </form>
      <div id="answer"></div>
      <h2>Later</h2>
      <button type="button" disabled>Outreach</button>
      <button type="button" disabled>Scheduling</button>
      <button type="button" disabled>Invoices</button>
    </aside>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
