name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @roofing/web exec playwright install --with-deps chromium
      - name: E2E (fixture dataset, offline agent)
        run: pnpm e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t roofing-crm:ci .
      - name: Smoke /health
        run: |
          docker run -d --name crm -p 8080:8080 -e PIPELINE_MCP_URL= -e OPENAI_API_KEY= roofing-crm:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break || sleep 1; done
          curl -fsS localhost:8080/build.json
          docker rm -f crm
