name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Sibling layout (architecture Decision 1): the CRM links the Oracle repo for its `contract`
      # export (zod schemas and types), at the commit pinned in deploy/hosted.json (oracleCommit).
      - uses: actions/checkout@v4
        with:
          path: roofing-crm
      - id: pin
        run: echo "sha=$(jq -r .oracleCommit roofing-crm/deploy/hosted.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: shengda/oracle-property-intelligence-platform-pipeline-broward-fl
          ref: ${{ steps.pin.outputs.sha }}
          path: oracle-property-intelligence-platform-pipeline-broward-fl
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: roofing-crm/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Oracle contract
        working-directory: oracle-property-intelligence-platform-pipeline-broward-fl
        run: npm ci --ignore-scripts && npx tsc -p tsconfig.build.json
      - working-directory: roofing-crm
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
