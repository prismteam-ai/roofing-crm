name: Check

on:
  push:
    branches: [miami-dade-roofing-crm]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
