# Amplify Hosting monorepo spec (repo root).
# Connect GitHub → branch feature/foundation; leave app root empty so Amplify
# picks up applications[].appRoot. Set branch env VITE_API_URL + NODE_VERSION=22.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm install -g pnpm@9.15.0
            - cd ../..
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm turbo run build --filter=@roofing-crm-challenge/web...
      artifacts:
        # Relative to appRoot (apps/web) when using applications[].appRoot.
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
          - ../../.pnpm-store/**/*
    # SPA fallback for client routes (Amplify Hosting customRules).
    customRules:
      - source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>"
        target: /index.html
        status: "200"
